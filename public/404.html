<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Algorithm Visual Lab</title>
    <script>
      // SPA fallback for GitHub Pages deep links:
      // /Algorithm-Visual-Lab/sorting -> /Algorithm-Visual-Lab/#/sorting
      (function () {
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, -1).join('/') + '/' +
            '#/' + l.pathname.slice(l.pathname.indexOf('/', 1) + 1)
        );
      })();
    </script>
  </head>
  <body></body>
</html>
